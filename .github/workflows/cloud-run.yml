# Deploy the public GitHub repo to Cloud Run on every push to main.
#
# Auth is Workload Identity Federation for project studio-512005.
# No JSON key is stored in GitHub. The Muse key and the admin password already
# live in Secret Manager (muse-api-key is mounted as MODEL_API_KEY).
name: Deploy Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT_ID: studio-512005
  REGION: us-central1
  SERVICE: multimodal-studio
  IMAGE: us-central1-docker.pkg.dev/studio-512005/multimodal/studio

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/469528918286/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@studio-512005.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE:${GITHUB_SHA}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --execution-environment gen2 \
            --memory 8Gi \
            --cpu 4 \
            --timeout 3600 \
            --cpu-boost \
            --no-cpu-throttling \
            --concurrency 160 \
            --max-instances 2 \
            --update-env-vars "HOST=0.0.0.0,RELOAD=0,LLM_PROVIDER=muse,MUSE_MODEL=muse-wonder-1.0,MUSE_VISION_MODEL=muse-wonder-1.0,MUSE_LITE_MODEL=muse-spark-1.3,MUSE_TTS_VOICE=Kore,MUSE_LIVE_VOICE=Aoede,MUSE_IMAGE_MODEL=muse-image-1.0,INTERVIEW_LIVE_MODEL=muse-wonder-1.0,TOPIC_RESEARCH_ENABLED=true" \
            --set-secrets "MODEL_API_KEY=muse-api-key:latest"

      - name: Print service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)'
